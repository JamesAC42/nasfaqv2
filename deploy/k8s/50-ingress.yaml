apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nasfaq-web
  namespace: nasfaq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # Dynamic page preload headers can exceed the default upstream header buffer.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - holo.nasfaq.biz
      secretName: holo-nasfaq-biz-tls
  rules:
    - host: holo.nasfaq.biz
      http:
        paths:
          # Game tables live on one pod (api-games, see 20-api.yaml); the longer prefix wins.
          - path: /api/games
            pathType: Prefix
            backend:
              service:
                name: api-games
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-web
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-client
                port:
                  name: http
