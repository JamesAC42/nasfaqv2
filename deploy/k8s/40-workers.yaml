apiVersion: apps/v1
kind: Deployment
metadata:
  name: holonews
  namespace: nasfaq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holonews
  template:
    metadata:
      labels:
        app: holonews
    spec:
      containers:
        - name: holonews
          image: ghcr.io/jamesac42/nasfaqv2-holonews:latest
          envFrom:
            - configMapRef:
                name: nasfaq-app-config
            - secretRef:
                name: nasfaq-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
