apiVersion: v1
kind: ConfigMap
metadata:
  name: nasfaq-app-config
  namespace: nasfaq
data:
  PUBLIC_APP_BASE_URL: "https://holo.nasfaq.biz"
  CORS_ORIGIN: "https://holo.nasfaq.biz"
  AUTH_COOKIE_SECURE: "true"
  AUTH_SESSION_TTL_DAYS: "30"
  AUTH_EMAIL_FROM: "NASFAQ <noreply@auth.nasfaq.biz>"
  EMAIL_VERIFICATION_PATH: "/verify-email"
  EMAIL_VERIFICATION_TTL_HOURS: "24"
  SCRAPE_TIMEZONE: "America/New_York"
  LIVE_POLL_SECONDS: "1800"
  LIVE_VIEWER_POLL_SECONDS: "30"
  LIVE_REDIS_FRESH_MINUTES: "30"
  LIVE_MAX_RESULTS: "5"
  UPCOMING_MAX_RESULTS: "5"
  MARKET_DATA_TIMEZONE: "America/New_York"
  MARKET_SETTLEMENT_TIMEZONE: "America/New_York"
  # Weekly evaluation max-shares range (by subscriber rank; an IPO talent starts on the same curve).
  # Public-launch sizing: about $28M of shares at current prices, so a few thousand new players can
  # buy in without stocks selling out and no single account can corner the smallest one. Applies at
  # the next Saturday evaluation after the pods restart. Raising later is free; lowering below what
  # players hold starts buybacks.
  MARKET_MAX_SHARES_MIN: "10000"
  MARKET_MAX_SHARES_MAX: "50000"
  # Direct trades with Cash need accounts this old (code default 72 h), so a fresh alt can't hand
  # its starting money to a main account.
  EXCHANGE_MIN_ACCOUNT_AGE_HOURS: "168"
  # Per API pod. The db-s-2vcpu-4gb plan allows 97 connections: api-web x2 (up to 6 if scaled),
  # api-scheduler, api-games and the migration job at 8 each stay well under it.
  PG_POOL_MAX: "8"
  GEMINI_TIMEOUT_SECONDS: "300"
  GEMINI_TEXT_MODEL: "gemini-3-flash-preview"
  GEMINI_IMAGE_MODEL: "gemini-3.1-flash-image-preview"
  SERVER_API_BASE: "http://api-web.nasfaq.svc.cluster.local"
  NEXT_PUBLIC_API_BASE: ""
