apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-client
  namespace: nasfaq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-client
  template:
    metadata:
      labels:
        app: app-client
    spec:
      # One per node where possible, so losing a node never takes every copy with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app-client
      containers:
        - name: app-client
          image: ghcr.io/jamesac42/nasfaqv2-app-client:IMAGE_TAG
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nasfaq-app-config
            - secretRef:
                name: nasfaq-app-secrets
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-client
  namespace: nasfaq
spec:
  selector:
    app: app-client
  ports:
    - port: 80
      targetPort: http
      name: http
---
# Node drains and cluster upgrades evict at most one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-client
  namespace: nasfaq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: app-client
