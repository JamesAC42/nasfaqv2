<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hat and item fitter</title>
    <style>
      :root {
        --bg: #0a0c11;
        --ink: #0f1219;
        --ink-2: #151923;
        --rule: #232a37;
        --rule-2: #313a4b;
        --text: #e8ecf3;
        --mid: #a3acbd;
        --dim: #6f7a8e;
        --blue: #3fb8f5;
        --warn: #f5c542;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--rule-2);
        border-radius: 4px;
        background: var(--ink-2);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--mid);
      }
      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #04121b;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      input[type="search"],
      input[type="text"],
      input[type="number"],
      select {
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--rule-2);
        border-radius: 4px;
        background: var(--ink);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--rule);
        background: var(--ink);
      }
      header h1 {
        margin: 0;
        font: 700 1rem var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      header .group {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      header label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--mid);
      }
      #status {
        color: var(--mid);
        font-family: var(--mono);
        font-size: 12px;
      }
      #status.unsaved {
        color: var(--warn);
      }
      .keys {
        width: 100%;
        margin: 0;
        color: var(--dim);
        font-family: var(--mono);
        font-size: 12px;
      }
      .keys kbd {
        padding: 0 0.3rem;
        border: 1px solid var(--rule-2);
        border-radius: 3px;
        color: var(--mid);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 19rem;
        align-items: start;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(calc(var(--cell) * 1.5), 1fr));
        gap: 1px;
        padding: 1rem;
      }
      .cell {
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        padding: calc(var(--cell) * 0.62) 0.4rem 0.6rem;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        outline: none;
      }
      /* The grid display above would otherwise beat the hidden attribute, and filters would hide nothing. */
      .cell[hidden] {
        display: none;
      }
      .cell:hover {
        border-color: var(--rule-2);
      }
      .cell.selected {
        border-color: var(--blue);
        background: color-mix(in srgb, var(--blue) 8%, transparent);
      }
      .cell .label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        max-width: 100%;
        font-size: 12px;
      }
      .cell .label b {
        overflow: hidden;
        font-weight: 500;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--rule-2);
      }
      .cell.fitted .dot {
        background: var(--blue);
      }

      /* ── The picture and its hat: the same rules as the site (player-avatar.module.scss) ── */
      .avatar {
        position: relative;
        flex: none;
        display: inline-grid;
        place-items: center;
        width: var(--s);
        height: var(--s);
        background: var(--pc, #3a4458);
      }
      .round .avatar {
        border-radius: 50%;
      }
      .round .avatar > .pic {
        border-radius: 50%;
      }
      .avatar > .pic {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar > b {
        font: 800 calc(var(--s) * 0.4) var(--mono);
        color: #0b0d12;
      }
      .hat {
        position: absolute;
        left: calc(50% + var(--hx, 0) * var(--s));
        top: calc(var(--s) * (-0.42 + var(--hy, 0)));
        width: calc(var(--s) * 0.9);
        height: auto;
        transform: translateX(-50%) rotate(var(--hr, 0deg)) scale(var(--hk, 1));
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      .item {
        position: absolute;
        left: calc(78% + var(--hx, 0) * var(--s));
        top: calc(var(--s) * (0.4 + var(--hy, 0)));
        width: calc(var(--s) * 0.58);
        height: auto;
        transform: translateX(-50%) rotate(var(--hr, 0deg)) scale(var(--hk, 1));
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      /* ── end of the shared rules ── */
      .kind {
        flex: none;
        padding: 0 0.3rem;
        border: 1px solid var(--rule-2);
        border-radius: 3px;
        color: var(--dim);
        font: 10px var(--mono);
        letter-spacing: 0.08em;
      }

      aside {
        position: sticky;
        top: var(--head, 7rem);
        display: grid;
        gap: 0.8rem;
        padding: 1rem;
        border-left: 1px solid var(--rule);
        min-height: calc(100vh - var(--head, 7rem));
      }
      aside h2 {
        margin: 0;
        font-size: 1rem;
      }
      aside code {
        color: var(--dim);
        font-size: 12px;
        word-break: break-all;
      }
      .fields {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.35rem 0.6rem;
        align-items: center;
        font-family: var(--mono);
        font-size: 12px;
      }
      .fields input {
        width: 100%;
      }
      .fields .slider {
        grid-column: 1 / -1;
        margin: -0.1rem 0 0.25rem;
        accent-color: var(--blue);
      }

      /* Hats drag: grab a cell or a size preview. */
      .cell,
      .sizes figure {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      body.dragging,
      body.dragging * {
        cursor: grabbing !important;
      }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.4rem 1rem;
        padding: 0 0 0.4rem;
      }
      .sizes figure {
        display: grid;
        justify-items: center;
        gap: 0.3rem;
        margin: 0;
        color: var(--dim);
        font: 11px var(--mono);
      }
      .empty {
        color: var(--dim);
      }
      #error {
        margin: 1rem;
        color: #ff6b6b;
        font-family: var(--mono);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hat &amp; item fitter</h1>
      <span id="count" class="empty">loading…</span>
      <input id="search" type="search" placeholder="Search" />
      <select id="kind" aria-label="Which">
        <option value="all">Hats and items</option>
        <option value="hat">Hats</option>
        <option value="item">Items</option>
      </select>
      <select id="filter" aria-label="Show">
        <option value="all">Fitted or not</option>
        <option value="todo">Not fitted yet</option>
        <option value="done">Fitted</option>
      </select>
      <div class="group">
        <label>Picture
          <select id="picture">
            <option value="silhouette">Silhouette</option>
            <option value="initials">Initials</option>
            <option value="image">Image…</option>
          </select>
        </label>
        <input id="pictureUrl" type="text" placeholder="Image URL" hidden />
        <input id="pictureFile" type="file" accept="image/*" hidden />
        <input id="color" type="color" value="#3fb8f5" title="Picture colour" />
        <label><input id="round" type="checkbox" /> round</label>
      </div>
      <label>Size <input id="size" type="range" min="56" max="180" value="112" /></label>
      <div class="group">
        <button id="undo" type="button" disabled>Undo</button>
        <button id="copy" type="button">Copy JSON</button>
        <button id="save" type="button" class="primary" disabled>Save</button>
        <span id="status"></span>
      </div>
      <p class="keys">
        Drag a hat to move it (<kbd>Shift</kbd> fine), or click it, then <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move (<kbd>Shift</kbd> ×5, <kbd>Alt</kbd> fine) · <kbd>+</kbd><kbd>−</kbd> size · <kbd>[</kbd><kbd>]</kbd> tilt ·
        <kbd>0</kbd> reset · <kbd>,</kbd><kbd>.</kbd> previous / next · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>S</kbd> save
      </p>
    </header>
    <main>
      <div id="grid"></div>
      <aside id="panel"><p class="empty">Click a hat to fit it.</p></aside>
    </main>
    <p id="error" hidden></p>

    <script>
      // Fits are fractions of the picture's size (x right, y down), a scale and a tilt in degrees, the
      // same as app/lib/hat-fit.ts. A hat with no entry sits at the default spot.
      const DEFAULT = { x: 0, y: 0, scale: 1, rotate: 0 };
      const PREVIEW_SIZES = [26, 32, 48, 80, 96, 128];
      const RARITY = { common: "#9aa3b2", rare: "#3fb8f5", epic: "#b07cff", legendary: "#f5c542" };
      const SILHOUETTE =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a3242"/><circle cx="50" cy="42" r="22" fill="#8b95a8"/><path d="M14 100c2-22 17-34 36-34s34 12 36 34z" fill="#8b95a8"/></svg>',
        );

      const $ = (id) => document.getElementById(id);
      const store = {
        get: (key, fallback) => {
          try {
            return localStorage.getItem(`hatfit.${key}`) ?? fallback;
          } catch {
            return fallback;
          }
        },
        set: (key, value) => {
          try {
            localStorage.setItem(`hatfit.${key}`, value);
          } catch {}
        },
      };

      let hats = [];
      let fits = {};
      let savedJson = "{}";
      let selected = null;
      const history = [];
      let fileUrl = null;
      const cells = new Map();

      const fitOf = (key) => ({ ...DEFAULT, ...(fits[key] || {}) });
      const isFitted = (key) => Boolean(fits[key]) && JSON.stringify(fitOf(key)) !== JSON.stringify(DEFAULT);
      const cleanJson = () => {
        const out = {};
        for (const key of Object.keys(fits).sort()) {
          const fit = fitOf(key);
          const entry = {};
          for (const field of Object.keys(DEFAULT)) if (fit[field] !== DEFAULT[field]) entry[field] = fit[field];
          if (Object.keys(entry).length) out[key] = entry;
        }
        return JSON.stringify(out, null, 2);
      };

      function hatStyle(el, key) {
        const fit = fitOf(key);
        el.style.setProperty("--hx", fit.x);
        el.style.setProperty("--hy", fit.y);
        el.style.setProperty("--hk", fit.scale);
        el.style.setProperty("--hr", `${fit.rotate}deg`);
      }

      function pictureNode() {
        const mode = $("picture").value;
        if (mode === "initials") {
          const b = document.createElement("b");
          b.textContent = "AB";
          return b;
        }
        const img = document.createElement("img");
        img.className = "pic";
        img.alt = "";
        img.src = mode === "image" ? fileUrl || $("pictureUrl").value || SILHOUETTE : SILHOUETTE;
        return img;
      }

      function avatar(hat, size) {
        const span = document.createElement("span");
        span.className = "avatar";
        span.style.setProperty("--s", `${size}px`);
        span.style.setProperty("--pc", $("color").value);
        span.append(pictureNode());
        const img = document.createElement("img");
        // Items (held at the lower right) and hats (on top) start from different spots, as on the site.
        img.className = hat.kind === "item" ? "item" : "hat";
        img.alt = "";
        img.src = hat.image;
        img.dataset.key = hat.key;
        hatStyle(img, hat.key);
        span.append(img);
        return span;
      }

      function buildGrid() {
        const size = Number($("size").value);
        const grid = $("grid");
        grid.style.setProperty("--cell", `${size}px`);
        grid.replaceChildren();
        cells.clear();
        for (const hat of hats) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.key = hat.key;
          cell.title = hat.key;
          const label = document.createElement("div");
          label.className = "label";
          const dot = document.createElement("span");
          dot.className = "dot";
          const name = document.createElement("b");
          name.textContent = hat.name;
          name.style.color = RARITY[hat.rarity] || "inherit";
          label.append(dot, name);
          if (hat.kind === "item") {
            const tag = document.createElement("span");
            tag.className = "kind";
            tag.textContent = "ITEM";
            label.append(tag);
          }
          cell.append(avatar(hat, size), label);
          // Press to select; drag to move the hat.
          cell.addEventListener("pointerdown", (event) => startDrag(event, hat.key, size));
          grid.append(cell);
          cells.set(hat.key, cell);
        }
        refreshAll();
      }

      function refreshAll() {
        const query = $("search").value.trim().toLowerCase();
        const filter = $("filter").value;
        const kind = $("kind").value;
        let shown = 0;
        for (const hat of hats) {
          const cell = cells.get(hat.key);
          const fitted = isFitted(hat.key);
          cell.classList.toggle("fitted", fitted);
          cell.classList.toggle("selected", hat.key === selected);
          const visible =
            (!query || hat.name.toLowerCase().includes(query) || hat.key.includes(query)) && (filter === "all" || (filter === "done") === fitted) && (kind === "all" || hat.kind === kind);
          cell.hidden = !visible;
          if (visible) shown += 1;
        }
        const fittedCount = hats.filter((hat) => isFitted(hat.key)).length;
        $("count").textContent = `${shown} shown · ${fittedCount} of ${hats.length} fitted`;
        const dirty = cleanJson() !== savedJson;
        $("save").disabled = !dirty;
        $("status").textContent = dirty ? "unsaved changes" : $("status").dataset.saved || "";
        $("status").classList.toggle("unsaved", dirty);
        $("undo").disabled = !history.length;
        document.body.classList.toggle("round", $("round").checked);
      }

      function refreshHat(key) {
        for (const img of document.querySelectorAll(`img[data-key="${CSS.escape(key)}"]`)) hatStyle(img, key);
        // Update the panel in place: rebuilding it would drop a slider out from under the mouse.
        if (key === selected) updatePanelValues();
        refreshAll();
      }

      /** The selected hat's numbers into the panel's boxes and sliders (not the box being typed in). */
      function updatePanelValues() {
        if (!selected) return;
        const fit = fitOf(selected);
        for (const input of document.querySelectorAll("#panel [data-field]")) {
          if (input.type === "number" && input === document.activeElement) continue;
          input.value = fit[input.dataset.field];
        }
      }

      /** One undo step for a whole drag or slide: remember the fit as it was when it started. */
      function remember(key) {
        history.push({ key, before: fits[key] ? { ...fits[key] } : null });
      }

      /**
       * Press on a hat (its cell, or a preview in the panel) and drag to move it. `size` is the picture
       * it was grabbed on, so a drag converts to the same fractions the fit is kept in. Shift: fine.
       */
      function startDrag(event, key, size) {
        if (event.button !== 0) return;
        event.preventDefault();
        if (selected !== key) select(key);
        const handle = event.currentTarget;
        handle.setPointerCapture(event.pointerId);
        const start = { x: event.clientX, y: event.clientY, fit: fitOf(key) };
        let dragging = false;
        const move = (moved) => {
          const dx = moved.clientX - start.x;
          const dy = moved.clientY - start.y;
          if (!dragging) {
            if (Math.hypot(dx, dy) < 3) return;
            dragging = true;
            remember(key);
            document.body.classList.add("dragging");
          }
          const k = moved.shiftKey ? 0.25 : 1;
          setFit(key, { ...start.fit, x: start.fit.x + (dx * k) / size, y: start.fit.y + (dy * k) / size }, { record: false });
        };
        const end = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", end);
          handle.removeEventListener("pointercancel", end);
          document.body.classList.remove("dragging");
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", end);
        handle.addEventListener("pointercancel", end);
      }

      function renderPanel() {
        const panel = $("panel");
        const hat = hats.find((entry) => entry.key === selected);
        if (!hat) {
          panel.innerHTML = '<p class="empty">Click a hat to fit it.</p>';
          return;
        }
        const fit = fitOf(hat.key);
        panel.replaceChildren();
        const title = document.createElement("h2");
        title.textContent = hat.name;
        const key = document.createElement("code");
        key.textContent = `${hat.key} · ${hat.rarity}`;
        const fields = document.createElement("div");
        fields.className = "fields";
        const steps = { x: 0.005, y: 0.005, scale: 0.01, rotate: 0.5 };
        // Sliders for size and tilt; the boxes still take any value (and the keys still work).
        const sliders = { scale: [0.2, 3, 0.01], rotate: [-45, 45, 0.5] };
        for (const field of Object.keys(DEFAULT)) {
          const label = document.createElement("label");
          label.textContent = field;
          label.htmlFor = `f-${field}`;
          const input = document.createElement("input");
          input.type = "number";
          input.id = `f-${field}`;
          input.dataset.field = field;
          input.step = steps[field];
          input.value = fit[field];
          input.addEventListener("change", () => {
            const value = Number(input.value);
            if (Number.isFinite(value)) setFit(hat.key, { ...fitOf(hat.key), [field]: value });
          });
          fields.append(label, input);
          if (sliders[field]) {
            const [min, max, step] = sliders[field];
            const range = document.createElement("input");
            range.type = "range";
            range.className = "slider";
            range.dataset.field = field;
            range.min = min;
            range.max = max;
            range.step = step;
            range.value = fit[field];
            range.setAttribute("aria-label", `${field} slider`);
            let sliding = false;
            range.addEventListener("input", () => {
              if (!sliding) {
                sliding = true;
                remember(hat.key);
              }
              setFit(hat.key, { ...fitOf(hat.key), [field]: Number(range.value) }, { record: false });
            });
            range.addEventListener("change", () => {
              sliding = false;
            });
            fields.append(range);
          }
        }
        const reset = document.createElement("button");
        reset.type = "button";
        reset.textContent = "Reset to default";
        reset.addEventListener("click", () => setFit(hat.key, { ...DEFAULT }));
        const sizes = document.createElement("div");
        sizes.className = "sizes";
        for (const size of PREVIEW_SIZES) {
          const figure = document.createElement("figure");
          // Room above each picture for the hat, which can sit well over its top edge.
          figure.style.paddingTop = `${Math.round(size * 0.65)}px`;
          const caption = document.createElement("figcaption");
          caption.textContent = `${size}px`;
          figure.append(avatar(hat, size), caption);
          figure.addEventListener("pointerdown", (event) => startDrag(event, hat.key, size));
          sizes.append(figure);
        }
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "The sizes the site draws pictures at: leaderboard rows and chat are small, the podium and profile big.";
        panel.append(title, key, fields, reset, sizes, note);
      }

      function setFit(key, next, { record = true } = {}) {
        const round = (value, places) => Math.round(value * 10 ** places) / 10 ** places;
        const clean = {
          x: round(Math.max(-2, Math.min(2, next.x)), 4),
          y: round(Math.max(-2, Math.min(2, next.y)), 4),
          scale: round(Math.max(0.1, Math.min(5, next.scale)), 4),
          rotate: round(Math.max(-180, Math.min(180, next.rotate)), 1),
        };
        const before = fits[key] ? { ...fits[key] } : null;
        if (JSON.stringify(clean) === JSON.stringify(fitOf(key))) return;
        if (record) history.push({ key, before });
        fits[key] = clean;
        refreshHat(key);
      }

      function select(key) {
        selected = key;
        renderPanel();
        refreshAll();
        cells.get(key)?.scrollIntoView({ block: "nearest" });
      }

      function step(direction) {
        const visible = hats.filter((hat) => !cells.get(hat.key).hidden);
        if (!visible.length) return;
        const index = visible.findIndex((hat) => hat.key === selected);
        const next = visible[(index + direction + visible.length) % visible.length] || visible[0];
        select(next.key);
      }

      function undo() {
        const last = history.pop();
        if (!last) return;
        if (last.before) fits[last.key] = last.before;
        else delete fits[last.key];
        refreshHat(last.key);
      }

      async function save() {
        const body = cleanJson();
        $("save").disabled = true;
        try {
          const response = await fetch("/fits", { method: "PUT", headers: { "content-type": "application/json" }, body });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          savedJson = body;
          $("status").dataset.saved = `saved ${result.saved} fits to ${result.file}`;
        } catch (error) {
          $("status").dataset.saved = `save failed: ${error.message}`;
        }
        refreshAll();
      }

      document.addEventListener("keydown", (event) => {
        const typing = event.target instanceof HTMLSelectElement || (event.target instanceof HTMLInputElement && event.target.type !== "checkbox" && event.target.type !== "range");
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          void save();
          return;
        }
        if (typing) return;
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
          event.preventDefault();
          undo();
          return;
        }
        if (event.key === ",") return step(-1);
        if (event.key === ".") return step(1);
        if (!selected) return;
        const fit = fitOf(selected);
        const k = event.shiftKey ? 5 : event.altKey ? 0.25 : 1;
        const moves = {
          ArrowLeft: { x: fit.x - 0.01 * k },
          ArrowRight: { x: fit.x + 0.01 * k },
          ArrowUp: { y: fit.y - 0.01 * k },
          ArrowDown: { y: fit.y + 0.01 * k },
          "+": { scale: fit.scale + 0.02 * k },
          "=": { scale: fit.scale + 0.02 * k },
          "-": { scale: fit.scale - 0.02 * k },
          _: { scale: fit.scale - 0.02 * k },
          "[": { rotate: fit.rotate - 1 * k },
          "{": { rotate: fit.rotate - 1 * k },
          "]": { rotate: fit.rotate + 1 * k },
          "}": { rotate: fit.rotate + 1 * k },
          0: { ...DEFAULT },
          Backspace: { ...DEFAULT },
        };
        const change = moves[event.key];
        if (!change) return;
        event.preventDefault();
        setFit(selected, { ...fit, ...change });
      });

      window.addEventListener("beforeunload", (event) => {
        if (cleanJson() !== savedJson) event.preventDefault();
      });

      // Picture and layout controls (remembered between visits).
      for (const id of ["picture", "color", "size", "pictureUrl"]) {
        const value = store.get(id, null);
        if (value !== null) $(id).value = value;
      }
      $("round").checked = store.get("round", "0") === "1";
      const syncPictureInputs = () => {
        const image = $("picture").value === "image";
        $("pictureUrl").hidden = !image;
        $("pictureFile").hidden = !image;
      };
      syncPictureInputs();
      for (const id of ["picture", "color", "pictureUrl"]) {
        $(id).addEventListener("change", () => {
          store.set(id, $(id).value);
          syncPictureInputs();
          buildGrid();
          renderPanel();
        });
      }
      $("pictureFile").addEventListener("change", () => {
        const file = $("pictureFile").files[0];
        if (fileUrl) URL.revokeObjectURL(fileUrl);
        fileUrl = file ? URL.createObjectURL(file) : null;
        buildGrid();
        renderPanel();
      });
      $("size").addEventListener("input", () => {
        store.set("size", $("size").value);
        buildGrid();
      });
      $("round").addEventListener("change", () => {
        store.set("round", $("round").checked ? "1" : "0");
        refreshAll();
      });
      $("search").addEventListener("input", refreshAll);
      $("filter").addEventListener("change", refreshAll);
      $("kind").addEventListener("change", refreshAll);
      $("undo").addEventListener("click", undo);
      $("save").addEventListener("click", () => void save());
      $("copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(`${cleanJson()}\n`);
        $("status").dataset.saved = "copied the JSON";
        refreshAll();
      });
      new ResizeObserver(() => document.documentElement.style.setProperty("--head", `${document.querySelector("header").offsetHeight}px`)).observe(document.querySelector("header"));

      (async () => {
        try {
          const [hatList, saved] = await Promise.all([fetch("/hats").then((r) => r.json()), fetch("/fits").then((r) => r.json())]);
          if (hatList.error) throw new Error(hatList.error);
          hats = hatList.hats;
          fits = saved;
          savedJson = cleanJson();
          buildGrid();
        } catch (error) {
          $("error").hidden = false;
          $("error").textContent = `Couldn't load the hats: ${error.message}`;
          $("count").textContent = "";
        }
      })();
    </script>
  </body>
</html>
