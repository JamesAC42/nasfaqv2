name: codeql

# Static analysis for security bugs in the deployed code: the API and app-client (JavaScript and
# TypeScript), the three Go services, and these workflows. Results land in the Security tab under
# Code scanning, and new ones show on the pull request that adds them.
# This is CodeQL's "advanced setup"; leave "default setup" off in the repository settings, or the
# uploads from this workflow are refused. See docs/ops/security-updates.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            holonews/go.sum
            superchatscraper/go.sum
            ytscraper/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Not deployed: the old admin client, brokerbot, and the scrapers/tools not in deploy/.
          config: |
            paths-ignore:
              - client
              - brokerbot
              - 4chanscraper
              - channelscraper
              - holonews/reference_image_scraper
              - api/test
              - "**/node_modules"
      # Go is compiled, so CodeQL sees exactly what is built here: the three deployed services.
      - if: matrix.build-mode == 'manual'
        run: |
          for svc in holonews superchatscraper ytscraper; do
            (cd "$svc" && go build ./...)
          done
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
