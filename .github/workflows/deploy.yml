name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasfaq-production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: jamesac42

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: app-client
            context: .
            dockerfile: app-client/Dockerfile
          - name: holonews
            context: .
            dockerfile: holonews/Dockerfile
          - name: superchatscraper
            context: .
            dockerfile: superchatscraper/Dockerfile
          - name: ytscraper
            context: .
            dockerfile: ytscraper/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nasfaqv2-${{ matrix.name }}:sha-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Configure production context
        env:
          CLUSTER: ${{ secrets.DOKS_CLUSTER_NAME }}
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER" --alias nasfaq-prod --set-current-context=false

      - name: Migrate then deploy the validated revision
        env:
          RELEASE_SHA: ${{ github.sha }}
          CLUSTER: ${{ secrets.DOKS_CLUSTER_NAME }}
        run: |
          expected_server=$(doctl kubernetes cluster get "$CLUSTER" --format Endpoint --no-header)
          bash deploy/release.sh "$RELEASE_SHA" nasfaq-prod "$expected_server"
