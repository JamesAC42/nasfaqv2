name: ci

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nasfaq_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: nasfaq_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nasfaq_test -d nasfaq_chat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHAT_TEST_DATABASE_URL: postgres://nasfaq_test:local-test-only@127.0.0.1:5432/nasfaq_chat_test
    strategy:
      fail-fast: false
      matrix:
        app: [api, app-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm test --if-present
        working-directory: ${{ matrix.app }}
      - run: npm run build --if-present
        working-directory: ${{ matrix.app }}

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [holonews, superchatscraper, ytscraper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.svc }}/go.sum
      - run: go build ./cmd/${{ matrix.svc }}
        working-directory: ${{ matrix.svc }}
      - run: go vet ./...
        working-directory: ${{ matrix.svc }}

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: bash -n deploy/render-release.sh deploy/release.sh
